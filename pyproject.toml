[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wan-dit-lab"
version = "0.1.0"
description = "A learning implementation and inference optimization lab for Wan DiT"
requires-python = ">=3.10"
dependencies = ["torch>=2.10,<2.11", "safetensors>=0.8,<0.9", "huggingface-hub>=0.36,<1"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.12,<1"]

[project.scripts]
wan-lab = "wan_dit_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a CUDA GPU"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
